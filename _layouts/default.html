<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <a href="#about">About</a>
    <a href="#news">News</a>
    <a href="#publications">Publications</a>
    <a href="#education">Education</a>
    <a href="#research-experience">Research</a>
    <a href="#professional-experience">Experience</a>
    <a href="#certifications">Certifications</a>
    <button class="theme-toggle" aria-label="Toggle theme">◑</button>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
