title: Phongsakon Mark Konrad
email: phongsakon@outlook.dk
description: >-
  Phongsakon Mark Konrad. Independent researcher in mechanistic
  interpretability of language models. Tracing the circuits behind
  sandbagging, deception, and demographic dishonesty in open-weight
  models, and intervening on them at the layer level. Incoming MPhil
  in Machine Learning and Machine Intelligence at the University of
  Cambridge.
url: https://phomarkon.github.io
baseurl: ""

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: research
    values:
      layout: research

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - .git
  - .github
  - node_modules
